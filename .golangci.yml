version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - cyclop
    - errcheck
    - errorlint
    - gocognit
    - gocritic
    - govet
    - ineffassign
    - nilerr
    - nolintlint
    - staticcheck
    - unused
  settings:
    cyclop:
      max-complexity: 10
    errcheck:
      check-type-assertions: true
    gocognit:
      min-complexity: 15
    nolintlint:
      require-explanation: true
      require-specific: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1005 # i'm used to log method names in errors, they helped in late prod support couple of times.

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
