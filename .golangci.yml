version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - cyclop
    - errcheck
    - errorlint
    - gocognit
    - gocritic
    - govet
    - ineffassign
    - nilerr
    - nolintlint
    - staticcheck
    - unused
  settings:
    cyclop:
      max-complexity: 10
    errcheck:
      check-type-assertions: true
    gocognit:
      min-complexity: 15
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
